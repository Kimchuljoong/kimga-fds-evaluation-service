server:
  port: 9090

spring:
  profiles:
    active: test
  application:
    name: fdsevaldemo

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: fds-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      auto-offset-reset: earliest

    streams:
      auto-startup: false
      transaction:
        application-id: fds-transaction-streams
        properties:
          bootstrap.servers: ${spring.embedded.kafka.brokers}
          default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
          default.value.serde: org.springframework.kafka.support.serializer.JsonSerde
          state.dir: /tmp/kafka-streams/transaction

      aggregate:
        application-id: fds-aggregate-streams
        properties:
          bootstrap.servers:  ${spring.embedded.kafka.brokers}
          default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
          default.value.serde: org.springframework.kafka.support.serializer.JsonSerde
          state.dir: /tmp/kafka-streams/aggregate

      statics:
        application-id: fds-statics-streams
        properties:
          bootstrap.servers:  ${spring.embedded.kafka.brokers}
          default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
          default.value.serde: org.springframework.kafka.support.serializer.JsonSerde
          state.dir: /tmp/kafka-streams/statics

fds:
  window-size-seconds: 5

app:
  kafka:
    topics:
      transactions: transactions
      aggregateAlerts: fds-alerts-aggregate
      staticsAlerts: fds-alerts-statics
